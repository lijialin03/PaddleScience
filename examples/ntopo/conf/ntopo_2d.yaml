hydra:
  run:
    # dynamic output directory according to running time and override name
    dir: outputs_ntopo/${now:%Y-%m-%d}/${now:%H-%M-%S}/${hydra.job.override_dirname}
  job:
    name: ${mode} # name of logfile
    chdir: false # keep current working direcotry unchaned
    config:
      override_dirname:
        exclude_keys:
          - TRAIN.checkpoint_path
          - TRAIN.pretrained_model_path
          - EVAL.pretrained_model_path
          - mode
          - output_dir
          - output_dir_disp
          - output_dir_density
          - log_freq
  sweep:
    # output directory for multirun
    dir: ${hydra.run.dir}
    subdir: ./

# general settings
mode: train # running mode: train/eval
seed: 2023
log_freq: 20
output_dir: ${hydra:run.dir}
output_dir_disp: ${hydra:run.dir}/disp
output_dir_density: ${hydra:run.dir}/density

# set problem parameters
PROBLEM:
  name: "Beam2D"
  volume_ratio: 0.5
  alpha: 5.0
  exponent: 3.0  # TODO: trainable parameter
  vol_penalty_strength: 10.0
  nu: 0.3
  E: 1.0
  # use_oc: true
  # max_move: 0.2
  # damping_parameter: 0.5
  # use_mmse: true
  # filter: "sensitivity"
  # filter_radius: 2.0

# model settings
MODEL:
  input_keys: ["x_scaled", "y_scaled", "sin_x_scaled", "sin_y_scaled"]
  disp_net:
    input_keys: ${MODEL.input_keys}
    output_keys: ["u", "v"]
    num_layers: 6
    hidden_size: 60
    last_layer_init_scale: 1.0e-3
  density_net:
    input_keys: ${MODEL.input_keys}
    output_keys: ["density",]
    num_layers: 6
    hidden_size: 60
    last_layer_init_scale: 1.0e-3

# training settings
TRAIN:
  epochs: 100  # times for for-loop
  disp_net:
    epochs: 1
    iters_per_epoch: 1000
    optimizer:
      learning_rate: 3.0e-4
      beta2: 0.99
      epsilon: 1e-7
  density_net:
    epochs: 1
    iters_per_epoch: 50
    optimizer:
      learning_rate: 3.0e-4
      beta1: 0.8
      beta2: 0.9
      epsilon: 1e-7
  batch_size:
    constraint: 7500
    visualizer: 7500
  save_freq: 10
  eval_during_train: false
  eval_freq: 100
  pretrained_model_path: null
  checkpoint_path: null
  enable_parallel: false # whether to enable parallel training

# evaluation settings
EVAL:
  pretrained_model_path: null
  n_cells: [150, 50]
